<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="manifest" href="manifest.json" />
	<link rel="icon" type="image/x-icon" href="assets/icon-192.png" />
	<meta name="theme-color" content="#317d92" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Cola Eleitoral" />
	<title>Cola Eleitoral</title>
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div class="container">
		<header>
			<h1>NO DIA 04/10, LEVE A COLA!</h1>
			<h2>Anote os números de suas candidatas<br />ou candidatos aqui</h2>
		</header>

		<main>
			<!-- DEPUTADO FEDERAL -->
			<section class="cargo">
				<h3>Deputado Federal</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<!-- DEPUTADO ESTADUAL -->
			<section class="cargo">
				<h3>Deputado Estadual</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<!-- SENADOR 1 -->
			<section class="cargo">
				<h3>Senador (1ª vaga)</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<!-- SENADOR 2 -->
			<section class="cargo">
				<h3>Senador (2ª vaga)</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<!-- GOVERNADOR -->
			<section class="cargo">
				<h3>Governador</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<!-- PRESIDENTE -->
			<section class="cargo">
				<h3>Presidente da República</h3>
				<div class="inputs">
					<input class="numero" maxlength="1" inputmode="numeric" />
					<input class="numero" maxlength="1" inputmode="numeric" />
				</div>
			</section>

			<div class="acoes">
				<button type="button" id="limpar">Limpar números</button>
			</div>
		</main>
	</div>

	<script>
		const inputs = document.querySelectorAll(".numero");

		const STORAGE_KEY = "cola-eleitoral";

		/*
		 * Carrega os números salvos
		 */
		function carregarNumeros() {
			const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

			inputs.forEach((input, index) => {
				input.value = dados[index] || "";
			});
		}

		/*
		 * Salva todos os números
		 */
		function salvarNumeros() {
			const dados = Array.from(inputs).map((input) => input.value);

			localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
		}

		/*
		 * Aceita somente números
		 */
		inputs.forEach((input, index) => {
			input.addEventListener("input", () => {
				input.value = input.value.replace(/\D/g, "");

				salvarNumeros();

				/*
				 * Se digitou um número,
				 * vai para o próximo campo
				 */
				if (input.value && index < inputs.length - 1) {
					inputs[index + 1].focus();
				}
			});

			/*
			 * Backspace volta para o campo anterior
			 */
			input.addEventListener("keydown", (event) => {
				if (event.key === "Backspace" && input.value === "" && index > 0) {
					inputs[index - 1].focus();
				}
			});
		});

		/*
		 * Limpar todos os números
		 */
		document.querySelector("#limpar").addEventListener("click", () => {
			const confirmar = confirm("Deseja apagar todos os números?");

			if (!confirmar) {
				return;
			}

			inputs.forEach((input) => {
				input.value = "";
			});

			localStorage.removeItem(STORAGE_KEY);

			inputs[0].focus();
		});

		/*
		 * Inicializa
		 */
		carregarNumeros();
	</script>

	<script>
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", () => {
				navigator.serviceWorker
					.register("./sw.js")
					.then(() => console.log("PWA pronta!"))
					.catch((error) => console.error("Erro ao registrar PWA:", error));
			});
		}
	</script>
</body>

</html>
